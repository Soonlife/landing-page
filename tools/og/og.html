<!DOCTYPE html>
<!-- 링크 공유 미리보기 이미지(1200×630) 원본. tools/og/render.cjs로 resources/images/og-image.png를 만든다 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
    @import url('../../resources/styles/root.css');
    @import url('../../resources/styles/index.css');
    html, body { margin: 0; width: 1200px; height: 630px; background: #000; overflow: hidden; }
    .Og {
        position: relative;
        display: flex;
        align-items: center;
        gap: 72px;
        width: 1200px;
        height: 630px;
        padding: 0 96px;
        box-sizing: border-box;
        color: #f5f5f7;
        background:
            radial-gradient(520px 420px at 290px 330px, rgb(38 83 156 / 0.55), transparent 70%),
            #000;
    }
    .OgIcon {
        flex: none;
        width: 280px;
        filter: drop-shadow(0 30px 60px rgb(38 83 156 / 0.75));
    }
    .OgText { display: flex; flex-direction: column; }
    .OgWordmark { font-size: 64px; line-height: 1; }
    .OgTitle {
        margin-top: 28px;
        font-size: 62px;
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.04em;
    }
    .OgNote {
        margin-top: 28px;
        font-size: 26px;
        font-weight: 500;
        color: #a1a1a6;
    }
</style>
</head>
<body>
<div class="Og">
    <span class="AppTile OgIcon"><img src="../../resources/images/app-icon.png" alt=""></span>
    <div class="OgText">
        <p class="OgWordmark"><span class="SoonWordmark"><span class="SoonAccent">순</span>라이프</span></p>
        <p class="OgTitle">순천향의 모든 생활을<br>한 곳에서.</p>
    </div>
</div>
</body>
</html>
